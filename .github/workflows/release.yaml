name: Release

permissions: {}

on:
  push:
    tags:
      # We only want to trigger on tags that start with "artifacthub-mcp@",
      # since that's the format of the release tags we create.
      #
      # This is important to prevent accidentally triggering this workflow on
      # other tags that might be pushed to the repository.
      #
      # The reason behind all of this, is that release-plz creates a tag and pushes them,
      # but since we need to include prebuilt assets, we need to have release-plz create a
      # draft release, which we can add assets to, and then once the release is ready, we can publish it.
      - "artifacthub-mcp@*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-guard:
    name: release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release-guard
      deployment: false
    steps:
      - run: echo "release guard passed"

  build:
    name: build ${{ matrix.target }}
    needs: release-guard
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          if ! rustup target list --installed | grep -q "^${TARGET}$"; then
            rustup target add "$TARGET"
          fi

      - name: test
        shell: bash
        run: cargo test

      - name: build release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: package artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#artifacthub-mcp@}"
          name="artifacthub-mcp-${version}-${TARGET}"
          bin="target/${TARGET}/release/artifacthub-mcp"

          mkdir -p dist
          if [ "${ARCHIVE}" = "zip" ]; then
            bin="${bin}.exe"
            mkdir -p "${name}"
            cp LICENSE "${name}/"
            cp "${bin}" "${name}/"
            powershell -Command "Compress-Archive -Path '${name}' -DestinationPath 'dist/${name}.zip'"
          else
            mkdir -p "${name}"
            cp LICENSE "${name}/"
            cp "${bin}" "${name}/"
            tar -C . -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  checksums:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: generate SHA256
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - name: upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/SHA256SUMS
          retention-days: 1

  publish-release:
    runs-on: ubuntu-latest
    needs: checksums
    permissions:
      contents: write
    environment:
      name: release
      deployment: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: download checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist

      - name: generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: luxass
          repositories: artifacthub-rs
          permission-contents: write

      - name: upload assets and publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
