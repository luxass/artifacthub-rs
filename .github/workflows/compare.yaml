name: compare

on:
  schedule:
    # Every 3 days. Adjust the day-of-month step for a different cadence.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: clippy rustfmt
          tools: just
          cache-key: compare
          save-cache: ${{ github.ref_name == 'main' }}

      - name: Run live comparison (Hub API vs MCP server)
        run: just compare-mcp

      # Near-future: notify on failure via Cloudflare Worker -> SMS.
