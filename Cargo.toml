[workspace]
members = [
    "crates/artifacthub-client",
    "crates/artifacthub-mcp-server",
    "crates/artifacthub-server-mock",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/luxass/artifacthub-rs"

[workspace.dependencies]
artifacthub-client = { version = "=0.0.7", path = "crates/artifacthub-client" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", features = ["json", "query"] }
thiserror = "=2.0.21"
semver = "=1.0.28"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros"] }
schemars = { version = "=1.2.2", features = ["derive"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io"] }
clap = { version = "=4.6.7", features = ["derive"] }
wiremock = "=0.6.5"
